name: Main Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      java_version: "17"
      node_version: "20"
      run_tests: true

  docker:
    needs: build-test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      backend_image_name: shopapp-backend
      frontend_image_name: shopapp-frontend
      tag: sha-${{ github.sha }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}
    
  security-scan:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Scan backend
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/workspace \
            aquasec/trivy image \
            --format sarif \
            --output /workspace/trivy-backend.sarif \
            --severity CRITICAL,HIGH \
            ${{ secrets.DOCKER_USERNAME }}/shopapp-backend:sha-${{ steps.sha.outputs.short }}

      - name: Scan frontend
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/workspace \
            aquasec/trivy image \
            --format sarif \
            --output /workspace/trivy-frontend.sarif \
            --severity CRITICAL,HIGH \
            ${{ secrets.DOCKER_USERNAME }}/shopapp-frontend:sha-${{ steps.sha.outputs.short }}

      - name: Upload backend report
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif

      - name: Upload frontend report
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif

      - name: Fail if critical vulnerabilities found
        run: |
          if grep -q '"level":"error"' trivy-backend.sarif 2>/dev/null || \
             grep -q '"level":"error"' trivy-frontend.sarif 2>/dev/null; then
            echo "Critical vulnerabilities found"
            exit 1
          fi

  deploy:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy step"

