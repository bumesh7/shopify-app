name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      backend_image_name:
        required: true
        type: string
      frontend_image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      backend_image_url: ${{ steps.meta_backend.outputs.image }}
      frontend_image_url: ${{ steps.meta_frontend.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Debug (helps catch your original issue)
      - name: Debug image names
        run: |
          echo "Backend image: ${{ inputs.backend_image_name }}"
          echo "Frontend image: ${{ inputs.frontend_image_name }}"
          echo "Tag: ${{ inputs.tag }}"

      # ✅ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # ================= BACKEND =================
      - name: Set backend image metadata
        id: meta_backend
        run: |
          IMAGE="${{ inputs.backend_image_name }}:${{ inputs.tag }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ inputs.backend_image_name }}:${{ inputs.tag }}
            ${{ inputs.backend_image_name }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ================= FRONTEND =================
      - name: Set frontend image metadata
        id: meta_frontend
        run: |
          IMAGE="${{ inputs.frontend_image_name }}:${{ inputs.tag }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ inputs.frontend_image_name }}:${{ inputs.tag }}
            ${{ inputs.frontend_image_name }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
