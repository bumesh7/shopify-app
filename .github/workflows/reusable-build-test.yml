name: Reusable — Build & Test

on:
  workflow_call:
    inputs:
      java_version:
        description: "Java version to use"
        type: string
        default: "17"
      node_version:
        description: "Node.js version to use"
        type: string
        default: "20"
      run_tests:
        description: "Whether to run tests"
        type: boolean
        default: true
    outputs:
      test_result:
        description: "Result of the test run: passed or failed"
        value: ${{ jobs.build-test.outputs.test_result }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (Java ${{ inputs.java_version }} / Node ${{ inputs.node_version }})
    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.set-result.outputs.test_result }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Backend: Java / Maven ──────────────────────────────────────────────────
      - name: Set up Java ${{ inputs.java_version }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Build backend (compile + package, skip tests)
        working-directory: backend
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Run backend tests
        if: ${{ inputs.run_tests }}
        working-directory: backend
        run: mvn test -B --no-transfer-progress
        continue-on-error: true
        id: backend-test

      # ── Frontend: Node / npm ───────────────────────────────────────────────────
      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: /api
          CI: false

      - name: Run frontend tests
        if: ${{ inputs.run_tests }}
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
        continue-on-error: true
        id: frontend-test
        env:
          CI: true

      # ── Post-test Evaluation ──────────────────────────────────────────────────
      - name: Determine test result
        id: set-result
        run: |
          BACKEND_RESULT="${{ steps.backend-test.conclusion }}"
          FRONTEND_RESULT="${{ steps.frontend-test.conclusion }}"
          if [[ "${{ inputs.run_tests }}" == "false" ]]; then
            echo "test_result=skipped" >> "$GITHUB_OUTPUT"
            echo "Tests skipped (run_tests=false)"
          elif [[ "$BACKEND_RESULT" == "failure" || "$FRONTEND_RESULT" == "failure" ]]; then
            echo "test_result=failed" >> "$GITHUB_OUTPUT"
            echo "One or more test suites failed"
            exit 1
          else
            echo "test_result=passed" >> "$GITHUB_OUTPUT"
            echo "All tests passed"
          fi

