name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      backend_image_name:
        required: true
        type: string
      frontend_image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      backend_image_url: ${{ steps.meta_backend.outputs.image }}
      frontend_image_url: ${{ steps.meta_frontend.outputs.image }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Debug
        run: |
          echo "User: ${{ secrets.docker_username }}"
          echo "Backend: ${{ inputs.backend_image_name }}"

      # Login
      - name: Login Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # ================= BACKEND =================
      - id: meta_backend
        run: |
          echo "image=${{ secrets.docker_username }}/${{ inputs.backend_image_name }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Build backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.docker_username }}/${{ inputs.backend_image_name }}:${{ inputs.tag }}
            ${{ secrets.docker_username }}/${{ inputs.backend_image_name }}:latest

      # ================= FRONTEND =================
      - id: meta_frontend
        run: |
          echo "image=${{ secrets.docker_username }}/${{ inputs.frontend_image_name }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Build frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.docker_username }}/${{ inputs.frontend_image_name }}:${{ inputs.tag }}
            ${{ secrets.docker_username }}/${{ inputs.frontend_image_name }}:latest
