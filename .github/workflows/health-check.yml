name: Scheduled Health Check

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Container Health Check
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/shopapp-backend:latest
      FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/shopapp-frontend:latest
      BACKEND_PORT:   "8080"
      FRONTEND_PORT:  "8081"

    steps:
      # ── Pull Images ─────────────────────────────────────────────
      - name: Pull backend image
        run: docker pull "$BACKEND_IMAGE"

      - name: Pull frontend image
        run: docker pull "$FRONTEND_IMAGE"

      # ── Network ─────────────────────────────────────────────────
      - name: Create network
        run: docker network create hc-net

      # ── Start dependencies (Postgres + Redis) ───────────────────
      - name: Start Postgres
        run: |
          docker run -d --name postgres \
            --network hc-net \
            -e POSTGRES_DB=shopapp \
            -e POSTGRES_USER=shopuser \
            -e POSTGRES_PASSWORD=shoppass \
            postgres:15

      - name: Start Redis
        run: |
          docker run -d --name redis \
            --network hc-net \
            redis:7

      # ── Backend ─────────────────────────────────────────────────
      - name: Start backend container
        run: |
          docker run -d --name hc-backend \
            --network hc-net \
            -p "$BACKEND_PORT:8080" \
            -e SPRING_PROFILES_ACTIVE=default \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=shopapp \
            -e DB_USER=shopuser \
            -e DB_PASSWORD=shoppass \
            -e REDIS_HOST=redis \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET=health-check-dummy-secret-32-chars-min \
            "$BACKEND_IMAGE"

      - name: Wait for backend (60s max)
        id: backend-health
        run: |
          STATUS="FAILED"
          for i in $(seq 1 12); do
            sleep 5
            if curl -sf "http://localhost:${BACKEND_PORT}/actuator/health" > /dev/null; then
              STATUS="PASSED"
              break
            fi
            echo "Attempt $i/12 - backend not ready"
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Backend: $STATUS"

      # ── Frontend ────────────────────────────────────────────────
      - name: Start frontend container
        run: |
          docker run -d --name hc-frontend \
            --network hc-net \
            -p "$FRONTEND_PORT:80" \
            "$FRONTEND_IMAGE"

      - name: Wait for frontend (40s max)
        id: frontend-health
        run: |
          STATUS="FAILED"
          for i in $(seq 1 8); do
            sleep 5
            if curl -sf "http://localhost:${FRONTEND_PORT}" > /dev/null; then
              STATUS="PASSED"
              break
            fi
            echo "Attempt $i/8 - frontend not ready"
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Frontend: $STATUS"

      # ── Debug logs (VERY IMPORTANT) ─────────────────────────────
      - name: Show backend logs
        if: always()
        run: docker logs hc-backend || true

      - name: Show frontend logs
        if: always()
        run: docker logs hc-frontend || true

      # ── Cleanup ────────────────────────────────────────────────
      - name: Cleanup containers
        if: always()
        run: |
          docker stop hc-backend hc-frontend postgres redis 2>/dev/null || true
          docker rm hc-backend hc-frontend postgres redis 2>/dev/null || true
          docker network rm hc-net 2>/dev/null || true

      # ── Summary ────────────────────────────────────────────────
      - name: Write report
        if: always()
        run: |
          B="${{ steps.backend-health.outputs.status }}"
          F="${{ steps.frontend-health.outputs.status }}"

          [[ "$B" == "PASSED" ]] && BI="✅" || BI="❌"
          [[ "$F" == "PASSED" ]] && FI="✅" || FI="❌"

          echo "## 🩺 Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | $BI $B |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $FI $F |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Checked: $(date -u)" >> $GITHUB_STEP_SUMMARY

      # ── Final fail condition ───────────────────────────────────
      - name: Fail if unhealthy
        if: |
          steps.backend-health.outputs.status == 'FAILED' ||
          steps.frontend-health.outputs.status == 'FAILED'
        run: |
          echo "❌ Health check failed — one or more services did not respond."
          exit 1
