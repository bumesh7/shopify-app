name: Scheduled Health Check

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Container Health Check
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/shopapp-backend:latest
      FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/shopapp-frontend:latest
      BACKEND_PORT:   "8080"
      FRONTEND_PORT:  "8081"

    steps:
      - name: Pull backend image
        run: docker pull "$BACKEND_IMAGE"

      - name: Pull frontend image
        run: docker pull "$FRONTEND_IMAGE"

      - name: Create network
        run: docker network create hc-net

      # ── Start Postgres and wait until ready ─────────────────────
      - name: Start Postgres
        run: |
          docker run -d --name postgres \
            --network hc-net \
            -e POSTGRES_DB=shopapp \
            -e POSTGRES_USER=shopuser \
            -e POSTGRES_PASSWORD=shoppass \
            postgres:15

      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 20); do
            if docker exec postgres pg_isready -U shopuser -d shopapp > /dev/null 2>&1; then
              echo "Postgres is ready after $((i*3))s"
              break
            fi
            echo "Attempt $i/20 - Postgres not ready"
            sleep 3
          done

      # ── Start Redis and wait until ready ────────────────────────
      - name: Start Redis
        run: |
          docker run -d --name redis \
            --network hc-net \
            redis:7

      - name: Wait for Redis to be ready
        run: |
          echo "Waiting for Redis..."
          for i in $(seq 1 10); do
            if docker exec redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            echo "Attempt $i/10 - Redis not ready"
            sleep 2
          done

      # ── Backend ─────────────────────────────────────────────────
      - name: Start backend container
        run: |
          docker run -d --name hc-backend \
            --network hc-net \
            -p "$BACKEND_PORT:8080" \
            -e SPRING_PROFILES_ACTIVE=default \
            -e MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health \
            -e MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=shopapp \
            -e DB_USER=shopuser \
            -e DB_PASSWORD=shoppass \
            -e REDIS_HOST=redis \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET=health-check-dummy-secret-32-chars-min \
            "$BACKEND_IMAGE"

      # Key fix: accept 200/401/403 as "app is up"; only 000/502/503 mean down
      - name: Wait for backend (90s max)
        id: backend-health
        run: |
          STATUS="FAILED"
          for i in $(seq 1 18); do
            sleep 5
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://localhost:${BACKEND_PORT}/api/products" || echo "000")
            echo "Attempt $i/18 - HTTP $HTTP"
            if [[ "$HTTP" != "000" && "$HTTP" != "502" && "$HTTP" != "503" && "$HTTP" != "" ]]; then
              STATUS="PASSED"
              echo "✅ Backend is up (HTTP $HTTP)"
              break
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Backend: $STATUS"

      # ── Frontend ────────────────────────────────────────────────
      - name: Start frontend container
        run: |
          docker run -d --name hc-frontend \
            --network hc-net \
            -p "$FRONTEND_PORT:80" \
            "$FRONTEND_IMAGE"

      - name: Wait for frontend (40s max)
        id: frontend-health
        run: |
          STATUS="FAILED"
          for i in $(seq 1 8); do
            sleep 5
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://localhost:${FRONTEND_PORT}" || echo "000")
            echo "Attempt $i/8 - HTTP $HTTP"
            if [[ "$HTTP" == "200" || "$HTTP" == "301" || "$HTTP" == "302" ]]; then
              STATUS="PASSED"
              echo "✅ Frontend is up (HTTP $HTTP)"
              break
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Frontend: $STATUS"

      # ── Debug logs (always) ─────────────────────────────────────
      - name: Show postgres logs
        if: always()
        run: docker logs postgres || true

      - name: Show backend logs
        if: always()
        run: docker logs hc-backend || true

      - name: Show frontend logs
        if: always()
        run: docker logs hc-frontend || true

      # ── Cleanup ─────────────────────────────────────────────────
      - name: Cleanup containers
        if: always()
        run: |
          docker stop hc-backend hc-frontend postgres redis 2>/dev/null || true
          docker rm  hc-backend hc-frontend postgres redis 2>/dev/null || true
          docker network rm hc-net 2>/dev/null || true

      # ── Summary ─────────────────────────────────────────────────
      - name: Write report
        if: always()
        run: |
          B="${{ steps.backend-health.outputs.status }}"
          F="${{ steps.frontend-health.outputs.status }}"
          [[ "$B" == "PASSED" ]] && BI="✅" || BI="❌"
          [[ "$F" == "PASSED" ]] && FI="✅" || FI="❌"
          echo "## 🩺 Health Check Report"            >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Status |"                >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|"                >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | $BI $B |"                >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $FI $F |"                >> $GITHUB_STEP_SUMMARY
          echo ""                                     >> $GITHUB_STEP_SUMMARY
          echo "- Checked: $(date -u)"                >> $GITHUB_STEP_SUMMARY

      # ── Final fail condition ─────────────────────────────────────
      - name: Fail if unhealthy
        if: |
          steps.backend-health.outputs.status == 'FAILED' ||
          steps.frontend-health.outputs.status == 'FAILED'
        run: |
          echo "❌ Health check failed — one or more services did not respond."
          exit 1
