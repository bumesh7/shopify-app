name: Scheduled Health Check

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours
  workflow_dispatch:           # Manual trigger for ad-hoc testing

permissions:
  contents: read

jobs:
  health-check:
    name: Container Health Check
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/shopapp-backend:latest
      FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/shopapp-frontend:latest
      BACKEND_PORT:   "8080"
      FRONTEND_PORT:  "8081"

    steps:
      # ── Pull Images ────────────────────────────────────────────────────────
      - name: Pull latest backend image
        run: docker pull "$BACKEND_IMAGE"

      - name: Pull latest frontend image
        run: docker pull "$FRONTEND_IMAGE"

      # ── Spin up a minimal network ──────────────────────────────────────────
      - name: Create test network
        run: docker network create hc-net

      # ── Backend health check ───────────────────────────────────────────────
      - name: Start backend container (mock env)
        run: |
          docker run -d --name hc-backend \
            --network hc-net \
            -p "$BACKEND_PORT:8080" \
            -e SPRING_PROFILES_ACTIVE=default \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=shopapp \
            -e DB_USER=shopuser \
            -e DB_PASSWORD=shoppass \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET=health-check-dummy-secret-32-chars-min \
            "$BACKEND_IMAGE"

      - name: Wait for backend to be reachable (up to 30 s)
        id: backend-health
        run: |
          STATUS="FAILED"
          for i in $(seq 1 6); do
            sleep 5
            if curl -sf "http://localhost:${BACKEND_PORT}/categories" > /dev/null 2>&1; then
              STATUS="PASSED"
              break
            fi
            echo "  Attempt $i/6 — not ready yet..."
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Backend health check: $STATUS"

      # ── Frontend health check ──────────────────────────────────────────────
      - name: Start frontend container
        run: |
          docker run -d --name hc-frontend \
            --network hc-net \
            -p "$FRONTEND_PORT:80" \
            "$FRONTEND_IMAGE"

      - name: Wait for frontend to be reachable (up to 20 s)
        id: frontend-health
        run: |
          STATUS="FAILED"
          for i in $(seq 1 4); do
            sleep 5
            if curl -sf "http://localhost:${FRONTEND_PORT}" > /dev/null 2>&1; then
              STATUS="PASSED"
              break
            fi
            echo "  Attempt $i/4 — not ready yet..."
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Frontend health check: $STATUS"

      # ── Cleanup ───────────────────────────────────────────────────────────
      - name: Stop and remove containers
        if: always()
        run: |
          docker stop hc-backend hc-frontend 2>/dev/null || true
          docker rm   hc-backend hc-frontend 2>/dev/null || true
          docker network rm hc-net 2>/dev/null || true

      # ── Step Summary ──────────────────────────────────────────────────────
      - name: Write health-check report
        if: always()
        run: |
          BACKEND_STATUS="${{ steps.backend-health.outputs.status }}"
          FRONTEND_STATUS="${{ steps.frontend-health.outputs.status }}"

          [[ "$BACKEND_STATUS"  == "PASSED" ]] && B_ICON="✅" || B_ICON="❌"
          [[ "$FRONTEND_STATUS" == "PASSED" ]] && F_ICON="✅" || F_ICON="❌"

          echo "## 🩺 Health Check Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service  | Image | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend  | \`$BACKEND_IMAGE\`  | ${B_ICON} ${BACKEND_STATUS}  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | \`$FRONTEND_IMAGE\` | ${F_ICON} ${FRONTEND_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Checked:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      # ── Fail the job if either service is down ────────────────────────────
      - name: Fail if any service is unhealthy
        if: |
          steps.backend-health.outputs.status == 'FAILED' ||
          steps.frontend-health.outputs.status == 'FAILED'
        run: |
          echo "❌ Health check failed — one or more services did not respond."
          exit 1
