name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Build & Test (reusable) ────────────────────────────────────────────────
  build-test:
    name: Build & Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      java_version: "17"
      node_version: "20"
      run_tests: true

  # ── Dependency Vulnerability Review (Day 49) ──────────────────────────────
  dependency-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@da4d0423b0192c23e53b66f3012a60a96a2bd9a7 # v4.6.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always

  # ── PR Summary Comment ─────────────────────────────────────────────────────
  pr-comment:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    needs: [build-test, dependency-review]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          BUILD_RESULT="${{ needs.build-test.result }}"
          DEP_RESULT="${{ needs.dependency-review.result }}"

          if [[ "$BUILD_RESULT" == "success" && "$DEP_RESULT" == "success" ]]; then
            echo "status=✅ All PR checks passed" >> "$GITHUB_OUTPUT"
            echo "emoji=🚀" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ One or more checks failed" >> "$GITHUB_OUTPUT"
            echo "emoji=🛑" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7 — already Node24 compatible
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const sha    = context.payload.pull_request.head.sha.substring(0, 7);
            const status = "${{ steps.status.outputs.status }}";
            const emoji  = "${{ steps.status.outputs.emoji }}";

            const body = [
              `## ${emoji} PR Pipeline Report`,
              ``,
              `| Check | Result |`,
              `|-------|--------|`,
              `| 🔨 Build & Test | ${{ needs.build-test.result }} |`,
              `| 🔒 Dependency Review | ${{ needs.dependency-review.result }} |`,
              ``,
              `**Branch:** \`${branch}\`  **Commit:** \`${sha}\``,
              ``,
              `> ${status}`,
              `> _No Docker images are built or pushed on pull requests._`,
            ].join('\n');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Print pipeline summary
        run: |
          echo "## 🔍 PR Checks Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔨 Build & Test | ${{ needs.build-test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔒 Dependency Review | ${{ needs.dependency-review.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.head_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ${{ steps.status.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
