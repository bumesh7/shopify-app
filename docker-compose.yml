version: '3.9'

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopapp
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - shopapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopapp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - shopapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: shopapp-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopapp
      DB_USER: shopuser
      DB_PASSWORD: shoppass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: shopapp-super-secret-jwt-key-minimum-256-bits-for-hs256-algorithm
      CORS_ORIGINS: http://localhost,http://localhost:3000,http://frontend
    ports:
      - "8080:8080"
    networks:
      - shopapp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/categories || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── React Frontend (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: shopapp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - shopapp-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  shopapp-network:
    driver: bridge
