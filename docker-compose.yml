version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopapp
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - shopapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - shopapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Only in "full" profile) ───────────────────
  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopapp-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopapp
      DB_USER: shopuser
      DB_PASSWORD: shoppass
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - shopapp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend (Only in "full" profile) ──────────────────
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopapp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - shopapp-network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  shopapp-network:
    driver: bridge
