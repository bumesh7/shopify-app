server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopapp}
    username: ${DB_USER:shopuser}
    password: ${DB_PASSWORD:shoppass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

jwt:
  secret: ${JWT_SECRET:shopapp-super-secret-key-256-bits-minimum-length-required}
  expiration: 86400000

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost}

logging:
  level:
    com.shopapp: DEBUG
    org.springframework.security: INFO
